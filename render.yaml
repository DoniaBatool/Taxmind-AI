services:
  # ── Backend — FastAPI ──────────────────────────────────────────────────────
  - type: web
    name: taxmind-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: APP_SECRET_KEY
        generateValue: true  # Render auto-generates a secure random string
      - key: CORS_ORIGINS
        sync: false          # set to your frontend URL after deploy
      - key: UPLOAD_DIR
        value: /tmp/uploads  # ephemeral storage on Render free tier

  # ── Frontend — React Static Site ───────────────────────────────────────────
  - type: web
    name: taxmind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false          # set to your backend URL after backend deploys
